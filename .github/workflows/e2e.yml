# e2e 全量回归：模型无关、网络隔离、无任何 secret。
# 套件自带后端启动脚本（start-server.sh 会先重建 /tmp 一次性内容层再拉起
# python3 server/server.py，全程只依赖标准库），CI 只需装好 Node 依赖和 Chromium。
name: e2e

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install e2e toolchain
        working-directory: tests/e2e
        run: npm ci

      # 套件经 @e2e-dev/web 直接使用 playwright-core（版本由 package-lock.json 钉死），
      # 因此用锁文件解析出的 playwright-core 自己的 CLI 装 Chromium，保证浏览器构建号匹配。
      - name: Install Chromium (pinned by package-lock.json)
        working-directory: tests/e2e
        run: node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Run e2e suite
        working-directory: tests/e2e
        run: E2E_TELEMETRY_DISABLED=1 npx e2e run

      - name: Upload e2e results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: tests/e2e/.e2e/results/
          if-no-files-found: ignore
          retention-days: 14
